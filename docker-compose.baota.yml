services:
  redis:
    image: redis:7-alpine
    container_name: plm-redis
    command: redis-server --appendonly yes
    volumes:
      - plm_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - plm-net

  server:
    build:
      context: ./plm-server
      dockerfile: Dockerfile
      args:
        BUILD_IMAGE: ${SERVER_BUILD_IMAGE:-maven:3.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${SERVER_RUNTIME_IMAGE:-eclipse-temurin:17-jre}
    container_name: plm-server
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${DB_URL}" in
          *"currentSchema=plm"*) exec java -jar app.jar ;;
          *) echo "DB_URL must include currentSchema=plm" >&2; exit 64 ;;
        esac
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: "${DB_URL:?DB_URL must be set}"
      DB_SCHEMA: plm
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_SECURITY_ENABLED: "true"
      APP_SECURITY_DEV_TOKEN: "${APP_SECURITY_DEV_TOKEN:?APP_SECURITY_DEV_TOKEN must be set}"
      APP_STORAGE_LOCAL_ROOT: data/uploads
      DINGTALK_MODEL_VARIANT_PROCESS_CODE: "${DINGTALK_MODEL_VARIANT_PROCESS_CODE:-}"
      DINGTALK_APP_KEY: "${DINGTALK_APP_KEY:-}"
      DINGTALK_APP_SECRET: "${DINGTALK_APP_SECRET:-}"
      DINGTALK_CALLBACK_TOKEN: "${DINGTALK_CALLBACK_TOKEN:-}"
      DINGTALK_AUTO_APPROVER_USER_ID: "${DINGTALK_AUTO_APPROVER_USER_ID:-}"
      DINGTALK_PRODUCT_LINE_CC_USER_IDS: "${DINGTALK_PRODUCT_LINE_CC_USER_IDS:-}"
      DINGTALK_OUTBOUND_ENDPOINT: "${DINGTALK_OUTBOUND_ENDPOINT:-}"
    volumes:
      - plm_uploads:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/api/v1/health/db | grep -q '\"database\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure:5
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    networks:
      - plm-net

  web:
    build:
      context: ./plm-web
      dockerfile: Dockerfile
    container_name: plm-web
    ports:
      - "${WEB_PORT:-8110}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - plm-net

networks:
  plm-net:
    driver: bridge

volumes:
  plm_redisdata:
  plm_uploads:
