[Unit]
RequiresMountsFor=/opt/1panel/apps/postgresql/postgresql/data
RequiresMountsFor=/opt/1panel/backup
RequiresMountsFor=/opt/1panel/docker/compose/openclaw/data/.openclaw
RequiresMountsFor=/opt/1panel/docker/compose/openviking/~/.openviking
RequiresMountsFor=/opt/1panel/www
RequiresMountsFor=/opt/1panel/apps/openresty/openresty/1pwaf/data
RequiresMountsFor=/opt/1panel/apps/openresty/openresty/log
After=data.mount

[Service]
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/apps/postgresql/postgresql/data
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/backup
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/docker/compose/openclaw/data/.openclaw
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/docker/compose/openviking/~/.openviking
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/www
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/apps/openresty/openresty/1pwaf/data
ExecStartPre=/usr/bin/mountpoint -q /opt/1panel/apps/openresty/openresty/log
